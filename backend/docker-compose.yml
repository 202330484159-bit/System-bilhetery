services:
  postgres:
    image: postgres:16-alpine
    container_name: cinetickets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinetickets
      POSTGRES_USER: cinetickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinetickets_dev}
    ports:
      - "5432:5432"
    volumes:
      - cinetickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinetickets -d cinetickets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinetickets_pgdata: