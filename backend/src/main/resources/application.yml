spring:
  application:
    name: cinetickets-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinetickets}
    username: ${DB_USERNAME:cinetickets}
    password: ${DB_PASSWORD:cinetickets_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}