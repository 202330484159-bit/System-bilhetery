spring:
  application:
    name: cinetickets-api
  datasource:
    # Use a JDBC URI copied from Supabase > Connect > Session pooler > JDBC.
    # Store the complete URI (including credentials) only in the DB_URL secret.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinetickets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # The initial V1/V2 schema was provisioned on Supabase already.
    # On that non-empty database Flyway records baseline version 2,
    # then applies only future migrations (V3+). Empty databases still run V1/V2.
    baseline-on-migrate: true
    baseline-version: 2
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}