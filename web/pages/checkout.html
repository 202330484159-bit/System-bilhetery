<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalizar pedido | CineTickets</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/redesign.css">
<script defer src="../js/app.js"></script><script defer src="../js/ui.js"></script>
</head>
<body>
<header class="topbar">
<a class="brand" href="../index.html"><img class="brand-logo" src="../assets/cinetickets-logo.svg" alt="CineTickets"></a>
<nav class="main-nav"><a href="../index.html">Filmes</a><a href="ingressos.html">Meus ingressos</a></nav>
</header>
<main class="page-shell narrow">
<a class="back-link" href="assentos.html">← Voltar aos assentos</a>
<span class="eyebrow">ETAPA 02 — REVISÃO DO PEDIDO</span>
<h1 class="page-title">Quase na hora do filme.</h1>
<p class="muted">Confira os detalhes antes de confirmar seu ingresso demonstrativo.</p>
<div class="checkout-layout">
<section class="panel checkout-card">
<h2>Seus ingressos</h2>
<div id="checkout-summary" class="summary-list"></div>
<div class="divider"></div>
<div class="summary-total"><span>Total</span><strong id="checkout-total">R$ 0,00</strong></div>
<p class="notice">Esta versão é um protótipo. Nenhum pagamento real será processado.</p>
<form id="checkout-form">
<label class="field-label" for="customer-name">Nome para o ingresso</label>
<input id="customer-name" class="text-field" required maxlength="70" placeholder="Seu nome">
<label class="field-label" for="customer-email">E-mail</label>
<input id="customer-email" class="text-field" type="email" required maxlength="120" placeholder="voce@email.com">
<button class="button button-primary full-width" type="submit">Confirmar ingresso <span>→</span></button>
</form>
</section>
</div>
</main>
</body>
</html>
